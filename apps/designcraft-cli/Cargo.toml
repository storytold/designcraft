[package]
name = "designcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "designcraft_cli"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "designcraft-cli"
path = "src/main.rs"

[dependencies]
designcraft-engine = { workspace = true }
designcraft-render = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-compose = { workspace = true }
designcraft-format = { workspace = true }
designcraft-pdf = { workspace = true }
designcraft-mcp = { workspace = true }
craft-file-formats = { workspace = true }
craft-image-codecs = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# The completions and man pages (examples/man-and-completions.rs), generated from the clap definition.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
