[package]
name = "designcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "designcraft"

[lints]
workspace = true

[dependencies]
designcraft-engine = { workspace = true }
designcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Decode real portal variants on every test host without starting a desktop service.
zbus = "5.19"
async-channel = "2"
futures-lite = "2"
async-io = "2"
tempfile = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for designcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The same winit eframe uses: to pick the X11 backend (file drag-and-drop) in main.rs.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# XDG Settings portal appearance signals; already used by the AccessKit stack.
zbus = "5.19"
async-channel = "2"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
