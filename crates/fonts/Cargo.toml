[package]
name = "designcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[features]
# Synthetic fonts for other crates' tests (`designcraft_fonts::testing`).
testing = []

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The font files CoreText has available (src/mac_fonts.rs): fonts that font services and managers
# register from their own folders. A safe API; MIT OR Apache-2.0. 20.x shares core-foundation 0.9
# and core-graphics 0.23 with the dependencies already locked.
core-text = "=20.1.0"
