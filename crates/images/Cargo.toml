[package]
name = "designcraft-images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft placed-graphic decoding: raster formats (PNG, JPEG, GIF, WebP, TIFF, BMP, PSD) and SVG"

[lints]
workspace = true

[dependencies]
designcraft-color = { workspace = true }
designcraft-fonts = { workspace = true }
image = { workspace = true }
tiff = { workspace = true }
resvg = { workspace = true }
skrifa = { workspace = true }
quick-xml = { workspace = true }
flate2 = "1"
log = { workspace = true }
craft-cms = { workspace = true }
zune-core = { version = "0.5", default-features = false }
zune-jpeg = "0.5"
# Reduced-size JPEG decoding (1/2, 1/4, 1/8 through the DCT) for screen proxies.
jpeg-decoder = { version = "0.3", default-features = false }

[dev-dependencies]
designcraft-fonts = { workspace = true, features = ["testing"] }
