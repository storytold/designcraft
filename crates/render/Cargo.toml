[package]
name = "designcraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-fonts = { workspace = true }
designcraft-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
designcraft-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
sha2.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
