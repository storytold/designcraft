[package]
name = "designcraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignCraft renderer: vello_cpu software rasterizer for canvas and exports"

[lints]
workspace = true

[dependencies]
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-fonts = { workspace = true }
designcraft-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
bytemuck = { workspace = true }
craft-pdf = { workspace = true, features = ["raster"] }
designcraft-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
craft-image-codecs = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png", "gif", "tiff"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
