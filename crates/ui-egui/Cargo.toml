[package]
name = "designcraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DesignCraft egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
# The vendor-neutral cloud types the Open and Save pages hand back: a file
# entry, a capability. Contracts only, so this crate still builds for the web.
# The service is reached through the backend the host application connects
# (see `cloud`).
craft-cloud = { workspace = true }
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-fonts = { workspace = true }
designcraft-compose = { workspace = true }
designcraft-render = { workspace = true }
designcraft-tools = { workspace = true }
designcraft-engine = { workspace = true }
# A cloud save encodes the layout here rather than through
# `designcraft_engine::cmd::to_bytes`, which turns a failure into empty bytes
# (see `cloud::encode`).
designcraft-format = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
regex = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
designcraft-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
designcraft-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
