[package]
name = "designcraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DesignCraft egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui-legacy = { workspace = true, features = ["native-windows"] }
craft-ui = { workspace = true }
# The panel dock's model and its JSON commands, on every target.
craft-behavior = { workspace = true }
craft-ui-panels = { workspace = true }
craft-window = { workspace = true }
craft-window-sdk = { workspace = true }
craft-keymap = { workspace = true }
craft-file-formats = { workspace = true }
designcraft-geom = { workspace = true }
designcraft-color = { workspace = true }
designcraft-doc = { workspace = true }
designcraft-fonts = { workspace = true }
designcraft-compose = { workspace = true }
designcraft-render = { workspace = true }
designcraft-tools = { workspace = true }
designcraft-engine = { workspace = true }
designcraft-textimport = { workspace = true }
craft-prepress = { workspace = true }
# The UI draws monochrome icon glyphs from egui's bundled emoji faces (☰, ⚠, 📋); 0.37 moved
# them behind this feature. They stay bundled copies of OSI/CC0 faces from `epaint_default_fonts`.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
web-time = { workspace = true }
# Unicode bidi classes are used only to bypass the label cache for ordinary LTR text.
unicode-bidi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# egui 0.37 no longer enables `default_fonts` for library consumers; egui_kittest disables
# egui's defaults, and package-scoped UI tests do not build the app binary.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
tempfile = { workspace = true }
designcraft-idml = { workspace = true }
zip = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
designcraft-fonts = { workspace = true, features = ["testing"] }
designcraft-engine = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The craft UI framework's own components (Properties > Transform's pilot rows). The browser build
# keeps the bespoke fields, so the framework is not a wasm dependency.
craft-ui-widgets = { workspace = true }
craft-color-ui = { workspace = true }
craft-theme = { workspace = true }
craft-host = { workspace = true }
craft-window-sdk = { workspace = true }
craft-update = { workspace = true }
# Edit > Keyboard Shortcuts: the framework's dialog over the app's keymap. The browser build has no dialog (craft-menu is native).
craft-menu = { workspace = true }
# File and message dialogs that never block the frame; the browser build uses its own path.
craft-dialogs = { workspace = true }
raw-window-handle = { workspace = true }
